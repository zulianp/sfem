# The torus, clamped at its inlet and pulled along y at its outlet. Run by hyperelasticity_torus.sh,
# from the directory holding torus_geometry.
mesh:
  path: torus_geometry/torus
  packed: false
  sidesets:
    - {name: inlet, file: torus_geometry/inlet}
    - {name: outlet, file: torus_geometry/outlet}
material: {type: NeoHookeanOgden}
dirichlet_conditions:
  - {type: sideset, format: name, name: inlet, value: [0, 0, 0], component: [0, 1, 2]}
  - {type: sideset, format: name, name: outlet, value: [0, -2, 0], component: [0, 1, 2]}
regime: steady
solver:
  linear: {format: MF, preconditioner: none}
output: {path: torus_output}
