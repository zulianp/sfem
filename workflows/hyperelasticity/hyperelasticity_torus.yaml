# The torus, clamped at its inlet and pulled at its outlet. Run by hyperelasticity_torus.sh.
mesh:
  path: geometry_torus/torus
  packed: false
  sidesets:
    - {name: inlet, file: geometry_torus/inlet}
    - {name: outlet, file: geometry_torus/outlet}
material: {type: NeoHookeanOgden, mu: 2, lambda: 2}
dirichlet_conditions:
  - {type: sideset, format: name, name: inlet, value: [0, 0, 0], component: [0, 1, 2]}
  - {type: sideset, format: name, name: outlet, value: [-2, 0, 0], component: [0, 1, 2]}
regime: steady
solver:
  linear: {format: MF, preconditioner: none}
output: {path: output_torus}
