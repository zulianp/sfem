# Time-temperature superposition at T = -50.0 C (a_T = 23.9, so the same series relaxes about 24x faster).
#
# WLF shifts the relaxation times: log10(a_T) = C1 (T - T_ref) / (C2 + T - T_ref), and
# tau_eff = tau / a_T. Read against its partner case, the warmer run must relax visibly
# faster -- same material, same twist, temperature the only difference.
#
# The temperatures are close to T_ref on purpose. These EPDM constants are steep: by
# T = -45 C the shift is already 526, every term satisfies dt/tau_eff > 30, and
# all of them relax fully within one step. Two runs
# above that threshold are literally the same problem, which is correct behaviour and a
# useless measurement.
#
# This exercises the wlf block of the case schema, which the main scenario parses but
# never switches on.

mesh:
  path: mesh
  packed: false
  sidesets:
    - {name: left, file: mesh/surface/sidesets/left}
    - {name: right, file: mesh/surface/sidesets/right}

material:
  type: GeneratedMooneyRivlinProny
  C10: 0.3
  C01: 0.05
  K: 50.0
  relaxation:
    iso:
      prony:
        - {g: 0.4, tau: 1.0}
        - {g: 0.3, tau: 10.0}
      wlf: {C1: 16.6253, C2: 47.4781, T_ref: -54.29}
      temperature: -50.0
      history_storage: float32

time:
  dt: 0.05
  t_end: 20.0

regime: quasi_static

constraints:
  - type: rotation
    sideset: right
    axis: x
    center: [0.0, 0.1, 0.1]
    angle: 0.6
    profile: {type: linear_ramp, start_time: 0, end_time: 1.0, start_value: 0, end_value: 1}

solver:
  newton:
    max_it: 300
    atol: 1.0e-08
    rtol: 0
    verbose: false
  linear:
    type: cg
    preconditioner: jacobi
    max_it: 4000

output:
  path: results_wlf_warm
  export_freq: 1000
  history_csv: results_wlf_warm/history.csv
  probes:
    - {type: control_point, at: [1.0, 0.2, 0.2]}
    - {type: torque, constraint: 0}

dirichlet_conditions:
  - type: sideset
    format: name
    name: left
    value: [0, 0, 0]
    component: [0, 1, 2]
