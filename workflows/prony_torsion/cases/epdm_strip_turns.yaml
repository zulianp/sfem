# The LDP valves' EPDM in torsion, a strip wound by full turns: twist, hold, release, recover.
#
# A 100 x 30 x 6 mm strip (mesh/, strip/make_meshes.py), clamped at x = 0, its other end wound about
# the strip's axis by `angle` (one turn here; --set constraints.0.angle=<N * 2 pi> for N turns) with a
# smooth ramp over 1 s, held until 1.15 s, then released and followed to 2 s. The wound end keeps its
# position along the axis (hold_axial): with it free, two turns buckle the strip into an S-fold
# instead of a helicoid. Material, series and
# time integration as epdm_torsion_release.yaml: Mooney-Rivlin with the 15-term EPDM series on the
# isochoric part, density 1150, BDF2 at dt = 1e-3 s (four stored terms).

mesh:
  path: mesh
  packed: false
  # By plane, so a TET4 box (which box_mesh.py writes no sidesets for) serves as well as a HEX8 one.
  sidesets:
    - {name: left, plane: {axis: x, at: min}}
    - {name: right, plane: {axis: x, at: max}}

material:
  type: GeneratedMooneyRivlinProny
  C10: 9.338236e7
  C01: 3.735294e8
  K: 9.027840e6
  relaxation:
    iso:
      prony:
        - {g: 1.553624e-9, tau: 1.61e+03}
        - {g: 6.954807e-4, tau: 1.29e+01}
        - {g: 3.012002e-4, tau: 1.53e-01}
        - {g: 2.802263e-3, tau: 9.89e-04}
        - {g: 6.080455e-3, tau: 1.18e-06}
        - {g: 6.729436e-2, tau: 8.51e-09}
        - {g: 2.216521e-1, tau: 1.42e-10}
        - {g: 1.897022e-1, tau: 1.80e-12}
        - {g: 1.118245e-1, tau: 1.27e-14}
        - {g: 5.062054e-2, tau: 2.00e-16}
        - {g: 6.899170e-2, tau: 1.10e-19}
        - {g: 4.582806e-2, tau: 1.38e-22}
        - {g: 8.606490e-2, tau: 1.62e-24}
        - {g: 6.749405e-2, tau: 6.62e-26}
        - {g: 7.857665e-2, tau: 1.82e-27}
      history_storage: full

regime: dynamic
dynamics: {scheme: bdf2, density: 1150, mass: lumped}
time: {dt: 1.0e-3, t_end: 2.0, max_cutbacks: 6}

constraints:
  - type: rotation
    sideset: right
    axis: x
    center: [0.1, 0.015, 0.003]
    angle: 6.283185307179586
    profile: {type: smooth_ramp, start_time: 0, end_time: 1.0, start_value: 0, end_value: 1}
    hold_axial: true
    release: 1.15

solver:
  # The release leaves the tangent indefinite where the bar is compressed: an iteration whose line
  # search finds no decrease is repeated on the tangent projected to positive semidefinite, so no
  # step is cut back and every run keeps the same time grid.
  newton: {max_it: 40, atol: 1.0e-6, rtol: 1.0e-10, verbose: false, tangent_projection: on_failure}
  linear: {type: cg, preconditioner: jacobi, max_it: 20000}

output:
  path: results
  export_freq: 1
  history_csv: results/history.csv
  probes:
    - {type: control_point, name: corner, at: [0.1, 0.03, 0.006]}
    - {type: control_point, name: mid, at: [0.05, 0.03, 0.006]}
    - {type: torque, constraint: 0}
    - {type: prony}
    - {type: memory}

dirichlet_conditions:
  - type: sideset
    format: name
    name: left
    value: [0, 0, 0]
    component: [0, 1, 2]
