# The same scenario with inertia, through sfem::BDF2Scheme.
#
# Quasi-static is the right regime for a relaxation experiment and is the default, but the
# release is a step change and a real body rings after one. dt is an order of magnitude
# smaller here and the run much shorter, because the interesting time scale is now the
# oscillation rather than the relaxation.
#
# Note that the inertia term also regularises the tangent, which is how the defects this
# spike found stayed hidden in SFEM's own dynamic tests. Do not gate the operator on this.

mesh:
  path: mesh
  packed: false
  sidesets:
    - {name: left, file: mesh/surface/sidesets/left}
    - {name: right, file: mesh/surface/sidesets/right}

material:
  type: GeneratedMooneyRivlinProny
  C10: 0.3
  C01: 0.05
  K: 50.0
  relaxation:
    iso:
      prony:
        - {g: 0.4, tau: 1.0}
        - {g: 0.3, tau: 10.0}
      history_storage: float32

time:
  dt: 0.05
  t_end: 6.0

regime: dynamic
dynamics:
  scheme: bdf2
  density: 1.0

constraints:
  - type: rotation
    sideset: right
    axis: x
    center: [0.0, 0.1, 0.1]
    angle: 0.6
    profile: {type: linear_ramp, start_time: 0, end_time: 1.0, start_value: 0, end_value: 1}
    release: 3.0

solver:
  newton:
    max_it: 300
    atol: 1.0e-08
    rtol: 0
    verbose: false
  linear:
    type: cg
    preconditioner: jacobi
    max_it: 4000

output:
  path: results_bdf2
  export_freq: 4
  history_csv: results_bdf2/history.csv
  probes:
    - {type: control_point, at: [1.0, 0.2, 0.2], rates: false}
    - {type: torque, constraint: 0}

dirichlet_conditions:
  - type: sideset
    format: name
    name: left
    value: [0, 0, 0]
    component: [0, 1, 2]
