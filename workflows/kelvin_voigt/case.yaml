# A unit cube of linear Kelvin-Voigt material, 10 x 10 x 10 HEX8, clamped on its bottom face (y = 0)
# and pressed on its top face (y = 1) by a constant traction along -y, from rest: it sinks and
# rings down to the static compression. Implicit Newmark with the consistent mass.
#
# The material is the one the hand-written KelvinVoigtNewmark defaulted to -- shear stiffness
# k = 4, bulk modulus K = 3, viscosity eta = 0.1 in sigma = K tr(eps) I + k dev(eps) + eta dev(eps_dot)
# -- in the generated material's parameters: mu = k/2, lmbda = K - k/3, eta_s = eta/2.
mesh:
  box: {n: [10, 10, 10], min: [0, 0, 0], max: [1, 1, 1]}
  packed: false
  sidesets:
    - {name: bottom, plane: {axis: y, at: min}}
    - {name: top, plane: {axis: y, at: max}}
material: {type: GeneratedLinearKelvinVoigt, mu: 2, lmbda: 1.6666666666666667, eta_s: 0.05, eta_b: 0}
dirichlet_conditions:
  - {type: sideset, format: name, name: bottom, component: [0, 1, 2], value: [0, 0, 0]}
loads:
  neumann:
    - {type: sideset, format: name, name: top, component: [1], value: [-2]}
regime: dynamic
dynamics: {scheme: newmark, density: 1, mass: consistent}
time: {dt: 0.01, t_end: 2}
output:
  path: output
  export_freq: 1
  probes: [{type: control_point, at: [0.5, 1, 0.5]}]
