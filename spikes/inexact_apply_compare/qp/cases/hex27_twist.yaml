# Large deformation: a 90 degree twist of a unit cube about its x axis, left face clamped. Shear
# strain reaches about 1.1 at the outer edges.  Size with --set mesh.box.n=[N,N,N]; operator with
# --set solver.linear.format=BSR|MF|INEXACT.
mesh:
  box: {n: [8, 8, 8], min: [0, 0, 0], max: [1, 1, 1]}
  reorder: morton3
  refine: 2              # one triquadratic (PROTEUS_HEX27) element per box cell
  basis: high_order
  sidesets:
    - {name: left, plane: {axis: x, at: min}}
    - {name: right, plane: {axis: x, at: max}}
material: {type: GeneratedNeoHookeanOgden, young_modulus: 1, poisson_ratio: 0.3}
dirichlet_conditions:
  - {type: sideset, format: name, name: left, component: [0, 1, 2], value: [0, 0, 0]}
constraints:
  - {type: rotation, sideset: right, axis: x, center: [1, 0.5, 0.5], angle: 1.5707963267948966,
     profile: {type: linear_ramp, start_time: 0, end_time: 1, start_value: 0, end_value: 1}}
regime: quasi_static
time: {dt: 0.03125, t_end: 1}   # the step every format converges in without retries
solver:
  newton: {max_it: 30, rtol: 1e-8, atol: 1e-12}
  linear: {type: cg, format: BSR, preconditioner: none, rtol: 1e-3, max_it: 5000}
