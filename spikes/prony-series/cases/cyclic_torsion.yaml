# Cyclic torsion: the viscoelastic LAG, seen directly.
#
# The relaxation scenario shows viscoelasticity as a torque that decays at fixed twist.
# This one shows it as a lag: the torque leads the twist, the torque-angle curve opens into
# a hysteresis loop instead of retracing itself, and the loop area is the energy dissipated
# per cycle. tools/analyse_hysteresis.py reads the loss angle off the last cycle and checks
# it against the closed-form Prony prediction tan(delta) = G''(w)/G'(w).
#
# The 12 s period is chosen deliberately. The loss angle peaks where w*tau ~ 1; with
# tau = {1, 10} it is largest (about 22.5 deg) near a 60-100 s period and falls off on both
# sides -- under 4 deg by a 1 s period, where the material has no time to relax and responds
# elastically. 12 s gives about 18 deg, unmistakable without costing a cycle per minute of
# simulated time.
#
# Keep this case QUASI-STATIC. Both dynamic options corrupt the measurement, in opposite ways:
#
#   Newmark at gamma = 0.5 is exactly non-dissipative, so the impulsive start of the sine rings
#   forever at the 2*dt period. The driver now detects that -- the reaction changes sign on every
#   step -- and abandons rather than producing 1800 steps of saw-tooth.
#
#   Newmark at gamma > 0.5 is stable but dissipates by construction, and that algorithmic damping
#   adds its own phase lag on top of the material's. Measured on this case: 23.675 deg against a
#   material prediction of 18.013 deg, i.e. nearly 6 deg of the answer supplied by the
#   integrator. The analysis flags it, because a measured angle ABOVE the deviatoric prediction
#   is something the material cannot do.
#
# Quasi-static gives 17.961 deg against 18.013 deg predicted. Inertia is not what is being
# measured here.
#
# The amplitude is 0.15 rad rather than the 0.6 the relaxation case uses, because the phase
# is read from the fundamental harmonic and a large twist makes the loop non-elliptic
# through geometric nonlinearity. The analysis reports its own fit residual as the guard.

mesh: mesh
verbose: false
material:
  C10: 0.3
  C01: 0.05
  K: 50.0
  prony:
  - g: 0.4
    tau: 1.0
  - g: 0.3
    tau: 10.0
  wlf:
    enabled: false
time:
  dt: 0.02
  t_end: 36.0
dynamics:
  type: quasi_static
torsion:
  sideset: mesh/surface/sidesets/right
  axis: x
  rotation_center:
  - 0.0
  - 0.1
  - 0.1
  angle: 0.5
  release:
    mode: hold
  profile: cyclic
  period: 12.0
solver:
  newton:
    max_it: 300
    tol: 1.0e-08
    alpha: 1.0
    line_search: true
  linear:
    type: cg
    rtol: 1.0e-10
    max_it: 4000
    preconditioner: true
output:
  path: results_cyclic
  export_freq: 8
  control_point:
  - 1.0
  - 0.2
  - 0.2
  history_csv: history.csv
dirichlet_conditions:
- type: sideset
  format: file
  path: mesh/surface/sidesets/left
  value:
  - 0
  - 0
  - 0
  component:
  - 0
  - 1
  - 2
