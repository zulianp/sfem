# The same scenario with inertia, through sfem::NewmarkInertiaPotential -- the integrator
# the Mooney-Rivlin tests in frontend/tests use, so results from this case are directly
# comparable with theirs. See bdf2_torsion_release.yaml for the other dynamic option.
#
# On beta and gamma. Newmark is unconditionally stable only for beta >= gamma/2 >= 1/4.
# (1/4, 1/2) is the trapezoidal rule: second order and exactly non-dissipative, and it is
# what the frontend tests use. It is not what this case uses, for a specific reason: a
# linear twist ramp starts with a velocity discontinuity at t = 0, which is an impulse, and
# a scheme with no damping rings on that impulse forever at the 2*dt period. Measured on
# this beam, the reaction torque then alternates sign every single step at an amplitude two
# orders above the signal, and the alternation is independent of the bulk modulus, which is
# what identifies it as the integrator rather than a stiff physical mode.
#
# So this case takes gamma = 0.6 with beta = (1+gamma)^2/4 = 0.64, the standard damped
# pairing, which removes it entirely. Do NOT raise gamma while leaving beta at 0.25: that
# leaves the unconditionally stable region and diverges on the first step, which reads like
# a solver failure rather than the parameter error it is. The case parser refuses that
# combination and names the beta to use.
#
# Note also that the inertia term adds alpha*M to the tangent diagonal, which regularises it
# -- that is exactly how the three tangent defects this spike found stayed hidden in SFEM's
# own dynamic tests. Do not gate the operator on this case; use prony_tangent_check.

mesh: mesh
verbose: false
material:
  C10: 0.3
  C01: 0.05
  K: 50.0
  # Same four Prony branches as the cantilever precision-comparison case; g_inf = 0.05.
  prony:
  - g: 0.4
    tau: 1.0
  - g: 0.4
    tau: 2.0
  - g: 0.1
    tau: 5.0
  - g: 0.05
    tau: 10.0
  wlf:
    enabled: false
time:
  dt: 0.005
  t_end: 30.0
dynamics:
  type: newmark
  density: 1.0
  beta: 0.64
  gamma: 0.6
torsion:
  sideset: mesh/surface/sidesets/right
  axis: x
  rotation_center:
  - 0.0
  - 0.1
  - 0.1
  angle: 6.4
  ramp_time: 4.0
  release:
    mode: free
    time: 5.
solver:
  newton:
    max_it: 300
    tol: 1.0e-08
    alpha: 1.0
    line_search: true
  linear:
    type: cg
    rtol: 1.0e-10
    max_it: 4000
    preconditioner: true
output:
  path: results_newmark
  export_freq: 10
  control_point:
  - 1.0
  - 0.2
  - 0.2
  history_csv: history.csv
dirichlet_conditions:
- type: sideset
  format: file
  path: mesh/surface/sidesets/left
  value:
  - 0
  - 0
  - 0
  component:
  - 0
  - 1
  - 2
