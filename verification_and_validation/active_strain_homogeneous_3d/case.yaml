schema_version: 2
id: active_strain_homogeneous_3d
name: Three-dimensional homogeneous active strain
kind: verification
family: hyperelastic
dimension: 3
tier: extended

source:
  description: Independent multiplicative-decomposition energy and first Piola stress
  reference: README.md

oracle:
  type: analytical
  implementation: oracle.py

material:
  mu: 2.0
  lambda: 5.0

modes: [undeformed, compatible]

mesh:
  command:
    - "{python}"
    - "{case_dir}/generate_mesh.py"
    - "{mesh}"
    - --element
    - "{element}"
    - --nx
    - "{resolution_nx}"
    - --ny
    - "{resolution_ny}"
    - --nz
    - "{resolution_nz}"

inputs:
  - {template: operator.yaml, output: "{output}/operator.yaml"}
  - {template: dirichlet_undeformed.yaml, output: "{output}/dirichlet_undeformed.yaml"}
  - {template: dirichlet_compatible.yaml, output: "{output}/dirichlet_compatible.yaml"}

verification:
  command: ["{python}", "{case_dir}/verify.py", --case, "{resolved_case}", --output, "{output}", --report, "{output}/verification.json"]
  report: "{output}/verification.json"
  tolerances:
    undeformed_displacement_relative_l2: 1.0e-9
    undeformed_free_residual_normalized: 1.0e-9
    undeformed_energy_relative: 1.0e-8
    undeformed_reaction_relative_l2: 1.0e-8
    compatible_displacement_relative_l2: 1.0e-9
    compatible_free_residual_normalized: 1.0e-9
    compatible_energy_relative: 1.0e-8
    compatible_reaction_relative_l2: 1.0e-8

variants:
  - id: neohookean_hex8_matrix_free
    operator: NeoHookeanOgdenActiveStrainPacked
    element: HEX8
    resolution: {nx: 4, ny: 4, nz: 4, backend: matrix_free}
    driver: &driver_mf_initialized_packed
      executable: "{python}"
      arguments:
        - "{suite_dir}/common/run_affine_modes.py"
        - --driver
        - "{build_dir}/playground"
        - --mesh
        - "{mesh}"
        - --input-dir
        - "{output}"
        - --output
        - "{output}/solution"
        - --initialize
        - --field
        - "active_strain={mesh}/fields/Fa.float64.raw"
        - --set
        - "solver.newton.atol=1.0e-11"
        - --set
        - "solver.newton.rtol=0"
        - --set
        - "solver.newton.max_it=30"
        - --set
        - "solver.newton.line_search.enabled=false"
        - --set
        - "solver.linear.preconditioner=none"
        - --set
        - "solver.linear.rtol=1.0e-12"
        - --set
        - "solver.linear.atol=1.0e-11"
        - --set
        - "solver.linear.max_it=20000"
        - --set
        - "solver.newton.verbose=false"
        - --set
        - "solver.linear.format=MF"
        - --set
        - "mesh.packed=true"
        - --set
        - "mesh.renumber=false"
        - undeformed
        - compatible
      environment:
        OMP_NUM_THREADS: 1
    expected_output: &expected_output
      required:
      - {pattern: SFEM_AFFINE_MODE_COMPLETE, count: 2}
      forbidden: [Newton did not converge, No progress made, (max iterations)]
    tolerances: &variant_tolerances
      undeformed_displacement_relative_l2: 1.0e-09

  - id: neohookean_hex8_bsr
    operator: NeoHookeanOgdenActiveStrainPacked
    element: HEX8
    resolution: {nx: 4, ny: 4, nz: 4, backend: bsr}
    driver: &driver_bsr_initialized_packed
      executable: "{python}"
      arguments:
        - "{suite_dir}/common/run_affine_modes.py"
        - --driver
        - "{build_dir}/playground"
        - --mesh
        - "{mesh}"
        - --input-dir
        - "{output}"
        - --output
        - "{output}/solution"
        - --initialize
        - --field
        - "active_strain={mesh}/fields/Fa.float64.raw"
        - --set
        - "solver.newton.atol=1.0e-11"
        - --set
        - "solver.newton.rtol=0"
        - --set
        - "solver.newton.max_it=30"
        - --set
        - "solver.newton.line_search.enabled=false"
        - --set
        - "solver.linear.preconditioner=none"
        - --set
        - "solver.linear.rtol=1.0e-12"
        - --set
        - "solver.linear.atol=1.0e-11"
        - --set
        - "solver.linear.max_it=20000"
        - --set
        - "solver.newton.verbose=false"
        - --set
        - "solver.linear.format=BSR"
        - --set
        - "mesh.packed=true"
        - --set
        - "mesh.renumber=false"
        - undeformed
        - compatible
      environment:
        OMP_NUM_THREADS: 1
    expected_output: *expected_output
    tolerances: *variant_tolerances

  - id: mooney_rivlin_hex8_matrix_free
    operator: MooneyRivlinActiveStrainPacked
    element: HEX8
    resolution: {nx: 4, ny: 4, nz: 4, backend: matrix_free}
    driver: *driver_mf_initialized_packed
    expected_output: *expected_output
    tolerances: *variant_tolerances

  - id: mooney_rivlin_hex8_bsr
    operator: MooneyRivlinActiveStrainPacked
    element: HEX8
    resolution: {nx: 4, ny: 4, nz: 4, backend: bsr}
    driver: *driver_bsr_initialized_packed
    expected_output: *expected_output
    tolerances: *variant_tolerances
