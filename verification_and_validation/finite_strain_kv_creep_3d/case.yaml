schema_version: 2
id: finite_strain_kv_creep_3d
name: Three-dimensional finite-strain Kelvin-Voigt creep
kind: verification
family: viscoelastic
dimension: 3
tier: fast

source:
  description: Homogeneous finite-strain axial and simple-shear Kelvin-Voigt equations
  reference: README.md
oracle: {type: analytical_ode, implementation: oracle.py}
geometry: {length: 1.0, height: 1.0, depth: 1.0}
loading: {traction: 0.8, ramp_time: 0.2}
time: {duration: 1.2, time_steps: [0.04, 0.02, 0.01]}
material: {mu: 2.0, lambda: 5.0, eta_s: 3.0, eta_b: 0.0}
material_parameter_map: {lambda: lmbda}

mesh:
  command: ["{python}", "{case_dir}/generate_mesh.py", "{mesh}", --element, "{element}", --nx, "{resolution_nx}", --ny, "{resolution_ny}", --nz, "{resolution_nz}"]
inputs:
  - {template: dirichlet_axial.yaml, output: "{output}/dirichlet_axial.yaml"}
  - {template: dirichlet_shear.yaml, output: "{output}/dirichlet_shear.yaml"}
  - {template: neumann_axial.yaml, output: "{output}/neumann_axial.yaml"}
  - {template: neumann_shear.yaml, output: "{output}/neumann_shear.yaml"}
verification:
  command: ["{python}", "{case_dir}/verify.py", --case, "{resolved_case}", --output, "{output}", --report, "{output}/verification.json"]
  report: "{output}/verification.json"
  tolerances: &tolerances
    response_history_relative_l2: 5.0e-3
    final_response_relative: 2.0e-3
    reaction_history_relative_l2: 1.0e-2
    temporal_rate_deficit: 0.0
    small_strain_limit_relative_l2: 1.0e-5

variants:
  - &axial
    id: tet4_axial_shear_viscosity
    operator: GeneratedMooneyRivlinKelvinVoigtNewmark
    element: TET4
    resolution: {nx: 4, ny: 2, nz: 2, mode: axial}
    driver: &axial_driver
      executable: "{python}"
      arguments: ["{suite_dir}/common/run_kv_creep.py", --case, "{resolved_case}", --driver, "{build_dir}/playground", --mesh, "{mesh}", --dirichlet, "{output}/dirichlet_axial.yaml", --neumann, "{output}/neumann_axial.yaml", --output, "{output}/solution", --operator, GeneratedMooneyRivlinKelvinVoigt, --param, "mu={material_mu}", --param, "lmbda={material_lambda}", --param, "eta_s={material_eta_s}", --param, "eta_b={material_eta_b}"]
      environment:
        OMP_NUM_THREADS: 1
    expected_output: &expected
      required:
        - {pattern: SFEM_TRANSIENT_LEVEL_COMPLETE, count: 3}
        - {pattern: SFEM_KV_CREEP_COMPLETE, count: 1}
      forbidden: ["nan"]
    tolerances: *tolerances
  - <<: *axial
    id: hex8_axial_shear_viscosity
    element: HEX8
  - <<: *axial
    id: tet4_axial_shear_bulk_viscosity
    material: {mu: 2.0, lambda: 5.0, eta_s: 3.0, eta_b: 2.0}
  - <<: *axial
    id: hex8_axial_shear_bulk_viscosity
    element: HEX8
    material: {mu: 2.0, lambda: 5.0, eta_s: 3.0, eta_b: 2.0}
  - <<: *axial
    id: tet4_simple_shear
    element: TET4
    resolution: {nx: 4, ny: 2, nz: 2, mode: simple_shear}
    driver:
      <<: *axial_driver
      arguments: ["{suite_dir}/common/run_kv_creep.py", --case, "{resolved_case}", --driver, "{build_dir}/playground", --mesh, "{mesh}", --dirichlet, "{output}/dirichlet_shear.yaml", --neumann, "{output}/neumann_shear.yaml", --output, "{output}/solution", --operator, GeneratedMooneyRivlinKelvinVoigt, --param, "mu={material_mu}", --param, "lmbda={material_lambda}", --param, "eta_s={material_eta_s}", --param, "eta_b={material_eta_b}"]
  - <<: *axial
    id: hex8_simple_shear
    element: HEX8
    resolution: {nx: 4, ny: 2, nz: 2, mode: simple_shear}
    driver:
      <<: *axial_driver
      arguments: ["{suite_dir}/common/run_kv_creep.py", --case, "{resolved_case}", --driver, "{build_dir}/playground", --mesh, "{mesh}", --dirichlet, "{output}/dirichlet_shear.yaml", --neumann, "{output}/neumann_shear.yaml", --output, "{output}/solution", --operator, GeneratedMooneyRivlinKelvinVoigt, --param, "mu={material_mu}", --param, "lmbda={material_lambda}", --param, "eta_s={material_eta_s}", --param, "eta_b={material_eta_b}"]
